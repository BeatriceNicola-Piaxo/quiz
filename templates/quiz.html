<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Questions</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 760px;
      margin: 48px auto;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
      padding: 32px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 2rem;
    }

    .welcome {
      margin-bottom: 24px;
      color: var(--text);
      font-size: 1.1rem;
    }

    .question {
      margin-top: 24px;
    }

    .question h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    label.option {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: #f9fafb;
      cursor: pointer;
    }

    input[type="radio"] {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
    }

    button {
      margin-top: 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result.success {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .result.error {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .result h3 {
      margin: 0 0 8px 0;
    }

    .result p {
      margin: 0;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="text-align:center; margin-bottom:20px;">
        <img
          src="{{ url_for('static', filename='logo.png') }}"
          alt="Piaxo Logo"
          style="max-width:180px; height:auto; display:block; margin:0 auto 10px;"
        />
      </div>
      <h1>🎯 Quiz Noaptea Companiilor 2026</h1>
      <p class="welcome">Welcome, {{ name }}!</p>

      <form id="quiz-form"></form>

      <div id="result" class="result" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const QUIZ_DATA = {{ questions|tojson }};

    const form = document.getElementById('quiz-form');
    const resultBox = document.getElementById('result');
    const playerName = {{ name|tojson }};
    const playerEmail = {{ email|tojson }};
    const playerPhone = {{ phone|tojson }};

    function buildQuizForm() {
      QUIZ_DATA.forEach((question, index) => {
        const questionBlock = document.createElement('div');
        questionBlock.className = 'question';

        const title = document.createElement('h2');
        title.textContent = `Question ${index + 1}: ${question.question}`;

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
          const label = document.createElement('label');
          label.className = 'option';

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `q${index}`;
          radio.value = option;
          radio.required = true;

          const text = document.createElement('span');
          text.textContent = option;

          label.appendChild(radio);
          label.appendChild(text);
          options.appendChild(label);
        });

        questionBlock.appendChild(title);
        questionBlock.appendChild(options);
        form.appendChild(questionBlock);
      });

      const submitButton = document.createElement('button');
      submitButton.type = 'submit';
      submitButton.textContent = 'Submit Answers';
      form.appendChild(submitButton);
    }

    buildQuizForm();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      let score = 0;
      let missingAnswer = false;

      QUIZ_DATA.forEach((question, index) => {
        const selectedAnswer = form.querySelector(`input[name="q${index}"]:checked`)?.value;
        if (!selectedAnswer) {
          missingAnswer = true;
          return;
        }

        if (selectedAnswer === question.answer) {
          score += 1;
        }
      });

      if (missingAnswer) {
        showResult('⚠️ Please answer all questions before submitting.', 'error');
        return;
      }

      const payload = {
        name: playerName,
        email: playerEmail,
        phone: playerPhone,
        score: `${score} / ${QUIZ_DATA.length}`
      };

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const responseData = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(responseData.error || 'Submission failed');
        }

        showResult(
          `## 🎉 Quiz Completed, ${playerName}!\n\n**Your Score: ${score} / ${QUIZ_DATA.length}**\n\n📊 Score saved successfully!`,
          'success'
        );
      } catch (error) {
        showResult(
          `## 🎉 Quiz Completed, ${playerName}!\n\n**Your Score: ${score} / ${QUIZ_DATA.length}**\n\n⚠️ Quiz completed, but the backend is not responding correctly.`,
          'error'
        );
      }
    });

    function showResult(message, type) {
      resultBox.className = `result visible ${type}`;
      resultBox.innerHTML = `<h3>Result</h3><p>${message.replace(/\n/g, '<br>')}</p>`;
    }
  </script>
</body>
</html>
